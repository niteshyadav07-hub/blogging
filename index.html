<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blogging Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Blog</h1>
        <p>Share your thoughts and ideas</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#blogs">Blogs</a>
        <a href="#create">Create Post</a>
    </nav>

    <section class="hero">
        <h2>Welcome to My Blog</h2>
        <p>Read interesting articles and share your ideas.</p>
    </section>

    <section id="blogs">
        <h2>Latest Posts</h2>

        <input
            type="text"
            id="search"
            placeholder="Search blogs..."
            onkeyup="searchBlogs()"
        >

        <div id="blogContainer"></div>
    </section>

    <section id="create">
        <h2>Create New Post</h2>

        <input type="text" id="title" placeholder="Blog Title">
        <input type="text" id="author" placeholder="Author Name">
        <textarea id="content" placeholder="Write your blog..."></textarea>

        <button onclick="addBlog()">Publish Blog</button>
    </section>

    <footer>
        <p>© 2026 My Blog | All Rights Reserved</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
